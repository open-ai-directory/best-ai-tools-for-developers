name: Add a tool
description: Suggest an AI tool to add to the directory
title: "Add: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: "Cursor"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      placeholder: "https://cursor.com"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong in? If none fit, open a "Suggest a category" issue instead.
      options:
        - AI Tools for Code Completion & Pair Programming
        - AI Tools for AI-Native Code Editors & Agentic IDEs
        - AI Tools for Autonomous Coding Agents
        - AI Tools for Code Review & Pull Request Automation
        - AI Tools for Static Analysis, Security & Code Quality
        - AI Tools for Test Generation & Coverage
        - AI Tools for Documentation Generation
        - AI Tools for SQL & Database Querying
        - Other / not sure
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Factual, ≤160 characters, no superlatives.
      placeholder: "AI-native fork of VS Code with an agentic Composer mode that plans, edits, and runs multi-file changes across a codebase."
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing tier
      options:
        - Free
        - Freemium
        - Paid
        - Paid (enterprise/custom pricing)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I'm not affiliated with this tool, or I've said so above/below
