name: Add a tool
description: Suggest an AI tool to add to the directory
title: "Add: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: "Cursor"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      placeholder: "https://cursor.com"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong in? If none fit, open a "Suggest a category" issue instead.
      options:
        - Code Completion & Pair Programming
        - AI-Native Code Editors & Agentic IDEs
        - Autonomous Coding Agents
        - Code Review & Pull Request Automation
        - Static Analysis, Security & Code Quality
        - Test Generation & Coverage
        - Documentation Generation
        - SQL & Database Querying
        - Debugging & Error Monitoring
        - API Design & Testing
        - DevOps, Infrastructure & Deployment
        - Commit Messages & Git Workflows
        - Other / not sure
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Factual, ≤160 characters, no superlatives.
      placeholder: "AI-native fork of VS Code with an agentic Composer mode that plans, edits, and runs multi-file changes across a codebase."
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: Icon (optional)
      description: >-
        A link to the tool's favicon/logo, or leave blank and we'll grab one from the
        site's favicon when the PR is made. See CONTRIBUTING.md for the exact file format.
      placeholder: "https://cursor.com/favicon.ico"
    validations:
      required: false
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing tier
      options:
        - Free
        - Freemium
        - Paid
        - Paid (enterprise/custom pricing)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I'm not affiliated with this tool, or I've said so above/below
